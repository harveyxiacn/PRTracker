name: Share my timeline (anonymised)
description: Add your application timeline to the open community dataset that helps others predict their wait.
title: 'Timeline: '
labels: [timeline]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for sharing! **Only post the anonymised record generated by the app**: type, submission month, optional office and day counts.
        Never include names, dates of birth, UCI/application numbers, emails or exact dates.
  - type: textarea
    id: record
    attributes:
      label: Record
      description: Paste the JSON from PR Tracker → Timeline → "Review & share on GitHub" (it is pre-filled when opened from the app).
      render: json
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: This record contains no personal information, and I agree to publish it under CC0.
          required: true
