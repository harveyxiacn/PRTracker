name: Release

# Push a tag like v0.1.0 to build and publish a GitHub release with the Android APK/AAB
# and a zipped web build. Signing secrets are optional (see docs/RELEASING.md); without
# them the release carries a debug-signed APK that can still be sideloaded for testing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Decode signing key
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build APK and AAB
        working-directory: android
        env:
          PRT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PRT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PRT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then export PRT_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"; fi
          ./gradlew assembleRelease bundleRelease assembleDebug --no-daemon --stacktrace
      - name: Collect assets
        run: |
          mkdir -p out
          V="${GITHUB_REF_NAME}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/pr-tracker-${V}-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/pr-tracker-${V}.apk"
            cp android/app/build/outputs/bundle/release/app-release.aab "out/pr-tracker-${V}.aab"
          fi
          (cd dist && zip -qr "../out/pr-tracker-${V}-web.zip" .)
          ls -la out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(awk "/^## \[${GITHUB_REF_NAME#v}\]/{f=1;next}/^## \[/{f=0}f" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" out/* --title "PR Tracker $GITHUB_REF_NAME" --notes "${NOTES:-See CHANGELOG.md}" || gh release upload "$GITHUB_REF_NAME" out/* --clobber
